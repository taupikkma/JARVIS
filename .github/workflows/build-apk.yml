name: Build JARVIS.AI APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Script Executable & Run Builder
        run: |
          chmod +x build-jarvis-apk.sh
          ./build-jarvis-apk.sh

      - name: Build APK with Gradle
        run: |
          cd jarvis-ai-android/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-AI-Debug-APK
          path: jarvis-ai-android/android/app/build/outputs/apk/debug/app-debug.apk
